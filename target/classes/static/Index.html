<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATC Tower Command & Flight Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ATC Radar & Flight Command Station</h1>
        <div class="status-indicator">STATUS: SYSTEM NORMAL</div>
    </header>

    <main class="main-container">
        <!-- Radar Visual Display -->
        <div class="radar-section">
            <canvas id="radarCanvas" width="500" height="500"></canvas>
        </div>

        <!-- Controls & Data Panel -->
        <div class="controls-section">
            <h2>Create New Flight</h2>
            <form id="spawnForm">
                <div class="input-group">
                    <label for="callsign">Callsign:</label>
                    <input type="text" id="callsign" placeholder="e.g. AI-505" value="AI-505">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="posX">X (50-550):</label>
                        <input type="number" id="posX" placeholder="300" value="300">
                    </div>
                    <div class="input-group">
                        <label for="posY">Y (50-550):</label>
                        <input type="number" id="posY" placeholder="300" value="300">
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="speedX">Speed X (-1 to 1):</label>
                        <input type="number" step="0.1" id="speedX" placeholder="0.5" value="0.5">
                    </div>
                    <div class="input-group">
                        <label for="speedY">Speed Y (-1 to 1):</label>
                        <input type="number" step="0.1" id="speedY" placeholder="-0.5" value="-0.5">
                    </div>
                </div>

                <div class="input-group">
                    <label for="altitude">Altitude:</label>
                    <input type="text" id="altitude" placeholder="e.g. FL300" value="FL300">
                </div>

                <button type="button" id="spawnBtn">+ SPAWN AIRCRAFT</button>
            </form>

            <hr style="border-color: #00ffcc22; margin: 20px 0;">

            <h2>Active Flights Tracker</h2>
            <p id="flightTrackerStatus">Loading active flights...</p>

            <h2>Vector Control: <span id="selectedFlight">None</span></h2>
            <div class="input-row">
                <div class="input-group">
                    <label>Vel X:</label>
                    <input type="number" id="vectorX" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Vel Y:</label>
                    <input type="number" id="vectorY" placeholder="0">
                </div>
            </div>

            <button type="button" id="updateVectorBtn" class="btn-blue">UPDATE VECTOR</button>
            <button type="button" id="clearFlightBtn" class="btn-red">LAND / CLEAR FLIGHT</button>
        </div>
    </main>

    <script src="Javascript.js"></script>
</body>
</html>
